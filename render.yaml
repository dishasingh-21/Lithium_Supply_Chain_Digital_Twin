# Render Blueprint for the combined Node (API + static client) + Python
# (lithium_twin digital twin) service. In the Render dashboard: New ->
# Blueprint -> connect this repo -> Render reads this file and proposes
# the service below; secrets (anything marked sync: false) are entered
# once in the dashboard, never committed here.
services:
  - type: web
    name: trace-li
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MAX_RANGE_KM
        sync: false
      - key: AVG_SPEED_KMH
        sync: false
      - key: CHARGE_STOP_MINUTES
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: LLM_API_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
